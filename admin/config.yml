
backend:
  name: turbo-github
  turbo_site_id: "0be49f31-799d-4492-a149-96a0f634e324"
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 일반 게시글 - Bug Bounty
  - name: "bugbounty"
    label: "Bug Bounty"
    label_singular: "Bug Bounty Post"
    folder: "src/content/bugbounty"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "hidden", default: "bugbounty" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # 일반 게시글 - Competition
  - name: "competition"
